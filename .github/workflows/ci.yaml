name: CI
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "13 3 * * 6"
  workflow_dispatch: {}

jobs:
  linters:
    name: Linting and static analysis
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # usually 1-2, rarely 3 mins (because of installations)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: "3.15"
          activate-environment: true
      - run: uv sync --no-dev --group lint
      - run: pre-commit run --all-files
      - run: mypy

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        # Assumption: if free-threaded works in one version, it works in all versions.
        python-version: [ "3.11", "3.12", "3.13", "3.14", "3.15", "3.15t" ]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5  # usually 2-3 mins
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv sync --no-dev --group test
      - run: coverage run --branch --source=kmock -m pytest --color=yes --timeout=2

      - name: Publish coverage to Coveralls.io
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          flag-name: ${{ matrix.python-version }}
        if: success()
        continue-on-error: true  # tends to fail with no code changes (e.g. only CI/docs)
      - name: Publish coverage to CodeCov.io
        uses: codecov/codecov-action@v7
        if: success()
        env:
          PYTHON: ${{ matrix.python-version }}
        with:
          flags: unit
          env_vars: PYTHON
          token: ${{ secrets.CODECOV_TOKEN }}

  # No coverage: PyPy performs extremely poorly with tracing/coverage (13 mins vs. 3 mins).
  # Extra time: 2-3 mins for building the dependencies (since no binary wheels are available).
  # Extra time: PyPy is good with JIT for repetitive code; tests are too unique for JIT.
  pypy-tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "pypy-3.11", "pypy-3.12" ]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          activate-environment: true
      - run: uv sync --no-dev --group test
      - run: pytest --color=yes --timeout=2

  e2e-tests:
    name: E2E with K3s
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          github-token: ${{ github.token }}
          enable-cache: true
          python-version: "3.15"
          activate-environment: true
      - uses: nolar/setup-k3d-k3s@v1
        with:
          version: latest
          github-token: ${{ github.token }}
          k3s-args: --disable=metrics-server@server:*
      - run: uv sync --no-dev --group test --extra fetch
      - run: coverage run --branch --source=kmock -m pytest tests/k8s-preloading/test_cli_fetching_e2e.py --color=yes --timeout=30

      - name: Publish coverage to Coveralls.io
        uses: coverallsapp/github-action@v2
        with:
          parallel: true
          flag-name: ${{ matrix.python-version }}
        if: success()
        continue-on-error: true  # tends to fail with no code changes (e.g. only CI/docs)
      - name: Publish coverage to CodeCov.io
        uses: codecov/codecov-action@v7
        if: success()
        env:
          PYTHON: ${{ matrix.python-version }}
        with:
          flags: e2e
          env_vars: PYTHON
          token: ${{ secrets.CODECOV_TOKEN }}

  coveralls-finish:
    name: Finalize coveralls.io
    needs: [unit-tests, pypy-tests, e2e-tests]
    runs-on: ubuntu-26.04
    steps:
      - name: Finish coverage at Coveralls.io
        uses: coverallsapp/github-action@v2
        with:
          parallel-finished: true
